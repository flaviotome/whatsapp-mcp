<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhatsApp MCP</title>
<style>
  :root { --bg:#f4f6f5; --card:#fff; --fg:#1b2420; --muted:#5f6b66; --ok:#1a8f4c; --warn:#b26a00; --err:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111614; --card:#1b221f; --fg:#e7ece9; --muted:#9aa6a1; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px; }
  main { background:var(--card); border-radius:16px; padding:28px; max-width:420px; width:100%; text-align:center;
         box-shadow:0 1px 3px rgba(0,0,0,.08); }
  h1 { font-size:20px; margin:0 0 4px; }
  #state { font-weight:600; margin:8px 0 16px; }
  #qr { width:300px; max-width:100%; aspect-ratio:1; border-radius:8px; background:#fff; display:none; margin:0 auto; }
  #pair { font:600 32px/1.2 ui-monospace, monospace; letter-spacing:4px; display:none; margin:16px 0; }
  ol { text-align:left; color:var(--muted); font-size:14px; padding-left:20px; }
  small { color:var(--muted); display:block; margin-top:12px; word-break:break-word; }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .err { color:var(--err); }
</style>
</head>
<body>
<main>
  <h1>WhatsApp MCP</h1>
  <div id="state">Carregando…</div>
  <img id="qr" alt="QR code de pareamento">
  <div id="pair"></div>
  <ol id="steps">
    <li>Abra o WhatsApp no celular.</li>
    <li>Configurações › Dispositivos conectados › Conectar um dispositivo.</li>
    <li>Aponte a câmera para este QR code (ele renova a cada ~20s).</li>
  </ol>
  <small id="detail"></small>
</main>
<script>
  const token = "{{TOKEN}}";
  const q = token ? "token=" + encodeURIComponent(token) : "";
  const labels = {
    starting: ["Iniciando conexão…", "warn"],
    waiting_qr: ["Escaneie o QR code", "warn"],
    waiting_pair_code: ["Digite o código no celular", "warn"],
    connected: ["Conectado", "ok"],
    reconnecting: ["Reconectando…", "warn"],
    logged_out: ["Sessão encerrada — aguardando novo QR", "err"],
    error: ["Erro", "err"],
  };
  async function tick() {
    try {
      const r = await fetch("/status" + (q ? "?" + q : ""), { cache: "no-store" });
      const s = await r.json();
      const [label, cls] = labels[s.state] || [s.state, "warn"];
      const el = document.getElementById("state");
      el.textContent = s.state === "connected" && s.phone ? `${label} como +${s.phone}` : label;
      el.className = cls;
      const img = document.getElementById("qr");
      if (s.qr_available) {
        img.src = "/qr.png?" + [q, "t=" + Date.now()].filter(Boolean).join("&");
        img.style.display = "block";
      } else {
        img.style.display = "none";
      }
      const pair = document.getElementById("pair");
      pair.textContent = s.pair_code || "";
      pair.style.display = s.pair_code ? "block" : "none";
      document.getElementById("steps").style.display = s.state === "connected" ? "none" : "block";
      document.getElementById("detail").textContent = s.last_error ? "Último erro: " + s.last_error : "";
    } catch (e) {
      document.getElementById("state").textContent = "Serviço indisponível";
    }
  }
  tick();
  setInterval(tick, 2000);
</script>
</body>
</html>
