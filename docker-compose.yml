# WhatsApp MCP — read-only WhatsApp access for AI agents.
#
#   docker compose up -d                      # local only (http://localhost:8000, use an SSH tunnel from a VM)
#   DOMAIN=wa.example.com docker compose --profile https up -d   # + public HTTPS via Caddy
#
# Settings can go in a .env file next to this one (see .env.example); none are required.

services:
  whatsapp-mcp:
    image: ghcr.io/flaviotome/whatsapp-mcp:${WHATSAPP_MCP_VERSION:-latest}
    restart: unless-stopped
    environment:
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      HOST_PORT: ${HOST_PORT:-8000}
      DOMAIN: ${DOMAIN:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      WA_PAIR_PHONE: ${WA_PAIR_PHONE:-}
      WA_PRESENCE_MODE: ${WA_PRESENCE_MODE:-quiet}
      WACLI_SYNC_MAX_MESSAGES: ${WACLI_SYNC_MAX_MESSAGES:-}
      WACLI_SYNC_MAX_DB_SIZE: ${WACLI_SYNC_MAX_DB_SIZE:-}
      MEDIA_PREFETCH_DAYS: ${MEDIA_PREFETCH_DAYS:-0}
      MEDIA_CACHE_MAX_MB: ${MEDIA_CACHE_MAX_MB:-1024}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      # Localhost only. From another machine, use an SSH tunnel or the https profile below.
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    volumes:
      # WhatsApp session, message index and the generated auth token. Removing it unlinks the device.
      - whatsapp-data:/data

  caddy:
    # Optional public HTTPS endpoint with automatic Let's Encrypt certificates.
    # Requires DOMAIN pointing to this machine and ports 80/443 open.
    image: caddy:2.10-alpine
    profiles: ["https"]
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN:-set-DOMAIN-in-.env} --to whatsapp-mcp:8000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
    depends_on:
      - whatsapp-mcp

volumes:
  whatsapp-data:
  caddy-data:
